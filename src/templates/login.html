<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - P-RingMaster</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #007BFF; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007BFF; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>P-RingMaster</h2>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="school_name">Nom de l'école :</label>
                <input type="text" id="school_name" name="school_name" required>
            </div>
            <div class="form-group">
                <label for="school_code">Code secret / ID :</label>
                <input type="password" id="school_code" name="school_code" required>
            </div>
            <button type="submit">Se connecter / S'inscrire</button>
        </form>
    </div>
</body>
</html>
